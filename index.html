<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pour Chloe</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg1:#fff3f7;--bg2:#ffd6e5;--ink:#5a1230;--soft:#9c4466;--btn:#d6336c;--btnink:#fff}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg1:#1d0a14;--bg2:#3d1229;--ink:#ffe3ee;--soft:#eaa6c0;--btn:#ff8fb1;--btnink:#3a0a1f}}
:root[data-theme="dark"]{--bg1:#1d0a14;--bg2:#3d1229;--ink:#ffe3ee;--soft:#eaa6c0;--btn:#ff8fb1;--btnink:#3a0a1f}
html,body{margin:0;min-height:100%}
body{background:radial-gradient(circle at 50% 30%,var(--bg2),var(--bg1) 70%);color:var(--ink);font-family:Georgia,'Times New Roman',serif;text-align:center;overflow-x:hidden;display:flex;flex-direction:column;align-items:center;padding:24px 20px 40px}
h1{font-weight:400;font-size:clamp(2rem,9vw,3rem);margin:8px 0 0;letter-spacing:.04em;opacity:0;animation:fade 1.6s 2.2s forwards}
h1 em{color:var(--soft);font-size:.55em;display:block;letter-spacing:.3em;text-transform:uppercase;margin-top:4px}
.stage{position:relative;width:320px;height:320px;margin:10px 0 0;cursor:pointer;-webkit-tap-highlight-color:transparent}
.flower{position:absolute;inset:0;transform-origin:50% 50%;animation:sway 6s ease-in-out infinite}
.p{position:absolute;left:50%;bottom:50%;transform-origin:50% 100%;border-radius:50% 50% 45% 45%/80% 80% 20% 20%;
transform:rotate(var(--a)) scale(0);animation:bloom 1.6s cubic-bezier(.2,.9,.3,1.2) var(--d) forwards;box-shadow:inset 0 -10px 14px rgba(120,10,60,.25)}
.core{position:absolute;left:50%;top:50%;width:26px;height:26px;margin:-13px;border-radius:50%;background:radial-gradient(#ffe38a,#f2a93b);transform:scale(0);animation:pop 1s 2s forwards}
.msg{max-width:30ch;font-size:1.15rem;line-height:1.7;margin:22px 0 6px;min-height:8.5em}
.msg span{opacity:0;display:block;animation:fade 1.4s forwards}
.sub{color:var(--soft);font-style:italic;font-size:.95rem;margin:0 0 18px}
button{font:inherit;border:0;border-radius:999px;padding:12px 28px;background:var(--btn);color:var(--btnink);cursor:pointer;font-size:1rem;box-shadow:0 6px 18px rgba(214,51,108,.35)}
button:active{transform:scale(.96)}
.fall{position:fixed;top:-30px;width:14px;height:20px;border-radius:50% 50% 45% 45%/80% 80% 20% 20%;pointer-events:none;opacity:.8;animation:fall linear infinite;z-index:0}
.stage,h1,.msg,.sub,button{position:relative;z-index:1}
@keyframes bloom{to{transform:rotate(var(--a)) scale(1)}}
@keyframes pop{to{transform:scale(1)}}
@keyframes fade{to{opacity:1}}
@keyframes sway{0%,100%{transform:rotate(-2deg)}50%{transform:rotate(2deg)}}
@keyframes fall{0%{transform:translate(0,0) rotate(0)}100%{transform:translate(var(--x),110vh) rotate(540deg)}}
@media (prefers-reduced-motion:reduce){.fall,.flower{animation:none}}
</style>
</head>
<body>
<h1>Chloe<em>Dalia</em></h1>
<div class="stage" id="stage"><div class="flower" id="flower"></div></div>
<div class="msg" id="msg"></div>
<p class="sub">Touche la fleur…</p>
<button id="again">Fais-la éclore</button>

<script>
// ✏️ Modifie ces phrases pour mettre tes propres mots
const MESSAGE = [
  "Comme le dahlia, tu fleuris",
  "même quand tout le monde pense que c’est l’hiver.",
  "Chloe, tu es ma plus belle fleur.",
  "Je t’aime. 🌸"
];
const layers = [
  {n:10,len:150,w:46,c:['#ffc2d6','#ff8fb1']},
  {n:12,len:125,w:42,c:['#ff9fc0','#f0649a']},
  {n:14,len:100,w:36,c:['#f56aa0','#d6336c']},
  {n:16,len:76,w:30,c:['#e0407f','#b01e5a']},
  {n:18,len:52,w:24,c:['#c22a6b','#8e1450']},
  {n:12,len:30,w:18,c:['#a31a5c','#6e0e3f']}
];
const flower = document.getElementById('flower');
function build(){
  flower.innerHTML = '';
  let d = 0;
  layers.forEach((L,i)=>{
    for(let k=0;k<L.n;k++){
      const p = document.createElement('div');
      p.className = 'p';
      const a = (360/L.n)*k + (i%2 ? 180/L.n : 0);
      p.style.cssText = `--a:${a}deg;--d:${(d+k*0.02).toFixed(2)}s;width:${L.w}px;height:${L.len}px;margin-left:-${L.w/2}px;background:linear-gradient(to top,${L.c[1]},${L.c[0]})`;
      flower.appendChild(p);
    }
    d += 0.28;
  });
  const core = document.createElement('div'); core.className = 'core'; flower.appendChild(core);
}
function fit(){
  const s = Math.min(1, (innerWidth - 40) / 320);
  document.getElementById('stage').style.transform = `scale(${s})`;
  document.getElementById('stage').style.marginBottom = `${(s - 1) * 320}px`;
}
function type(){
  const m = document.getElementById('msg'); m.innerHTML = '';
  MESSAGE.forEach((t,i)=>{
    const s = document.createElement('span'); s.textContent = t;
    s.style.animationDelay = (2.8 + i*1.4) + 's'; m.appendChild(s);
  });
}
function rain(){
  document.querySelectorAll('.fall').forEach(e=>e.remove());
  const cols = ['#ff8fb1','#f0649a','#ffc2d6','#d6336c'];
  for(let i=0;i<16;i++){
    const f = document.createElement('div'); f.className = 'fall';
    f.style.cssText = `left:${Math.random()*100}vw;--x:${(Math.random()*120-60)}px;background:${cols[i%4]};animation-duration:${8+Math.random()*8}s;animation-delay:${-Math.random()*14}s`;
    document.body.appendChild(f);
  }
}
function start(){ build(); type(); }
document.getElementById('again').onclick = start;
document.getElementById('stage').onclick = ()=>{
  flower.animate([{transform:'scale(1)'},{transform:'scale(1.08) rotate(6deg)'},{transform:'scale(1)'}],{duration:700,easing:'ease-out'});
  rain();
};
addEventListener('resize', fit);
fit(); start(); rain();
</script>
</body>
</html>
